services:
  toolbox:
    image: ghcr.io/minhung1126/toolbox:latest
    container_name: toolbox
    ports:
      - 8000:8000
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
