name: Validate container

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - backend/**
      - frontend/**
      - pyproject.toml
      - README.md
      - docs/**
      - docker-compose.yml
      - .env.example
      - .github/workflows/validate-container.yml
      - .github/workflows/publish-container.yml

permissions:
  contents: read

concurrency:
  group: validate-container-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and build container
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies and test tools
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Test backend
        run: |
          python -m ruff format --check backend
          python -m ruff check backend
          python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test -- --run
          npm run build

      - name: Validate Docker and Compose
        run: |
          cp .env.example .env
          docker build --build-arg APP_COMMIT_SHA=audit -t toolbox:audit .
          docker compose config
