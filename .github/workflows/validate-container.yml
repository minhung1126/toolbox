name: Validate container

on:
  workflow_call:
    inputs:
      repeat_browser_regressions:
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - backend/**
      - frontend/**
      - pyproject.toml
      - README.md
      - docs/**
      - docker-compose.yml
      - .env.example
      - .github/workflows/validate-container.yml
      - .github/workflows/publish-container.yml

permissions:
  contents: read

concurrency:
  group: validate-container-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and build container
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies and test tools
        run: python -m pip install --index-url https://pypi.org/simple --timeout 60 -r backend/requirements-dev.txt

      - name: Test backend
        run: |
          python -m ruff format --check backend
          python -m ruff check backend
          python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check frontend formatting, lint and types
        working-directory: frontend
        run: |
          npm run format:check
          npm run lint
          npm run lint:styles
          npm run typecheck

      - name: Run frontend unit and component tests
        working-directory: frontend
        run: npm test -- --run

      - name: Build frontend for browser tests
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run functional browser tests
        working-directory: frontend
        run: npx playwright test

      - name: Repeat responsive and recovery cases
        if: inputs.repeat_browser_regressions
        working-directory: frontend
        run: npx playwright test --grep '@responsive|@recovery' --repeat-each=3 --retries=0 --output test-results/e2e-repeat

      - name: Audit frontend production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Record full frontend dependency audit
        working-directory: frontend
        continue-on-error: true
        run: npm audit --json > audit-report.json

      - name: Upload full dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dependency-audit
          path: frontend/audit-report.json
          if-no-files-found: ignore

      - name: Upload functional browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-layout-screenshots
          path: |
            frontend/test-results/e2e/
            frontend/test-results/e2e-repeat/
          if-no-files-found: ignore

      - name: Validate Docker and Compose
        run: |
          cp .env.example .env
          docker build --build-arg APP_COMMIT_SHA=audit -t toolbox:audit .
          docker compose config

      - name: Scan container image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: toolbox:audit
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
