name: Publish container image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - backend/**
      - frontend/**
      - pyproject.toml
      - docker-compose.yml
      - .env.example
      - README.md
      - docs/**
      - .github/workflows/validate-container.yml
      - .github/workflows/publish-container.yml
  workflow_dispatch:
    inputs:
      skip_tests:
        description: Skip tests for this manual release
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: publish-container-main
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  validate:
    name: Test the release commit
    if: github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && inputs.skip_tests)
    uses: ./.github/workflows/validate-container.yml

  publish:
    name: Build and push image
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.validate.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && inputs.skip_tests && needs.validate.result == 'skipped')) }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version tag (dry run)
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          create_annotated_tag: true
          dry_run: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.tag_version.outputs.new_tag }},enable=${{ steps.tag_version.outputs.new_tag != '' }}
            type=raw,value=latest
            type=sha,format=long,prefix=
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tag_version.outputs.new_tag }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            APP_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=container-build
          cache-to: type=gha,mode=max,scope=container-build

      - name: Push version tag after successful image push
        id: push_tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          create_annotated_tag: true

      - name: Create GitHub release
        if: steps.push_tag.outputs.new_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.push_tag.outputs.new_tag }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          CHANGELOG: ${{ steps.push_tag.outputs.changelog }}
        run: |
          if gh release view "$NEW_TAG" >/dev/null 2>&1; then
            echo "Release $NEW_TAG already exists, skipping."
            exit 0
          fi
          {
            if [ -n "$CHANGELOG" ]; then
              printf '%s\n\n' "$CHANGELOG"
            fi
            printf '容器映像：`%s:%s`（`latest` 已同步更新）。\n\n' "$IMAGE_NAME" "$NEW_TAG"
            printf '[提交 %s](%s/%s/commit/%s) · [發布驗證](%s/%s/actions/runs/%s)\n' \
              "${GITHUB_SHA::7}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > release-notes.md
          gh release create "$NEW_TAG" \
            --verify-tag \
            --title "$NEW_TAG" \
            --notes-file release-notes.md
          rm -f release-notes.md
